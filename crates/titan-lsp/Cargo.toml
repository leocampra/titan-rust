[package]
name = "titan-lsp"
description = "Language server do Titan: diagnósticos, hover e autocomplete sobre o pipeline de titanc (PRD.md, T48)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
titanc = { path = "../titanc" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "io-util", "process"] }
